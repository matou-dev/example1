name: check
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      # Sibling layout (cf. hub README): tools/check.sh compiles against ../spi.
      # Actions pinned by SHA (checkout v7, setup-java v6); Dependabot keeps them fresh.
      # Siblings pin ref: main (GITHUB_TOKEN cannot resolve another repo's
      # default branch via API); the self checkout stays unpinned so PRs
      # test their own merge commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: example1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: matou-dev/spi
          ref: main
          path: spi
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - run: sh example1/tools/check.sh
